name: Release

# Roda quando sobe uma tag de versão, por exemplo: git push origin v1.0.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run build:win -- --publish never

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Yovel ${{ github.ref_name }}
          generate_release_notes: true
                    # latest.yml e .blockmap são usados pelo app para achar e baixar a versão nova
          files: |
            dist/Yovel.exe
            dist/Yovel.exe.blockmap
            dist/latest.yml